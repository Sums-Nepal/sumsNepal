<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Your Offer – Sums Nepal</title>
  <link rel="shortcut icon" href="../images/sums-logo-without-bg.png" type="image/x-icon">

  <!-- Open Graph Metadata -->
  <meta property="og:title" content="Post Your Offer – Sums Nepal" />
  <meta property="og:description" content="Submit your business offer through this form. Sums Nepal Business Platform." />
  <meta property="og:image" content="https://www.sumsnepal.com/images/form-preview.jpg" />
  <meta property="og:url" content="https://www.sumsnepal.com/post-your-offer" />
  <meta property="og:type" content="website" />

  <!-- Twitter Metadata -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Post Your Offer – Sums Nepal" />
  <meta name="twitter:description" content="Submit your business offer through this form." />
  <meta name="twitter:image" content="https://www.sumsnepal.com/images/form-preview.jpg" />

  <!-- SEO -->
  <meta name="description" content="Share your business offer with Sums Nepal using this quick form." />

  <!-- Tailwind CDN (for styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

  <section class="py-24 bg-white" id="business-page-form">
    <div class="container mx-auto px-4 text-center">
      
      <!-- Logo -->
      <a href="https://www.sumsnepal.com/" target="_blank">
        <div class="mb-8">
        <img src="../images/header_logo.png" alt="Sums Nepal Logo" class="mx-auto h-16" />
      </div>
      </a>

      <div class="text-center mb-16">
        <h2 class="text-3xl lg:text-4xl font-bold mb-4 text-black">
          Post <span class="text-orange-500">Your</span> Offer
        </h2>
        <p class="text-lg text-gray-600 max-w-2xl mx-auto">
          Share your organization's needs and connect with talented students
          and professionals who can help drive your mission forward.
        </p>
      </div>

      <div class="max-w-4xl mx-auto">
        <div class="border border-gray-200 shadow-lg rounded-lg">
          <div class="p-8">
            <form class="space-y-8" id="offerForm">
              
              <!-- Organization Details -->
              <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-2">
                  <label for="orgName" class="text-sm font-medium text-gray-700 block">Organization Name *</label>
                  <input id="orgName" name="orgName" type="text" placeholder="Enter organization name"
                         class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 border-gray-300 focus:ring-orange-500 focus:border-orange-500" required />
                  <p class="text-red-500 text-sm hidden" id="errorOrgName"></p>
                </div>
                <div class="space-y-2">
                  <label for="orgType" class="text-sm font-medium text-gray-700 block">Organization Type *</label>
                  <select id="orgType" name="orgType"
                          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 border-gray-300 focus:ring-orange-500 focus:border-orange-500" required>
                    <option value="">Select organization type</option>
                    <option value="private">Private</option>
                    <option value="public">Public</option>
                    <option value="ngo">NGO</option>
                    <option value="social-enterprise">Social Enterprise</option>
                    <option value="association">Association</option>
                  </select>
                  <p class="text-red-500 text-sm hidden" id="errorOrgType"></p>
                </div>
              </div>

              <!-- Contact Information -->
              <div>
                <h3 class="text-lg font-semibold text-black mb-4">Contact Information</h3>
                <div class="grid md:grid-cols-3 gap-6">
                  <div class="space-y-2">
                    <label for="contactName" class="text-sm font-medium text-gray-700 block">Contact Name *</label>
                    <input id="contactName" name="contactName" type="text" placeholder="Your full name"
                           class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 border-gray-300 focus:ring-orange-500 focus:border-orange-500" required />
                    <p class="text-red-500 text-sm hidden" id="errorContactName"></p>
                  </div>
                  <div class="space-y-2">
                    <label for="email" class="text-sm font-medium text-gray-700 block">Email *</label>
                    <input id="email" name="email" type="email" placeholder="your.email@domain.com"
                           class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 border-gray-300 focus:ring-orange-500 focus:border-orange-500" required />
                    <p class="text-red-500 text-sm hidden" id="errorEmail"></p>
                  </div>
                  <div class="space-y-2">
                    <label for="phone" class="text-sm font-medium text-gray-700 block">Phone *</label>
                    <input id="phone" name="phone" type="tel" placeholder="+977-9800000000"
                           class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 border-gray-300 focus:ring-orange-500 focus:border-orange-500" required />
                    <p class="text-red-500 text-sm hidden" id="errorPhone"></p>
                  </div>
                </div>
              </div>

              <!-- Opportunity Details -->
              <div>
                <h3 class="text-lg font-semibold text-black mb-4">Opportunity Details</h3>
                <div class="grid md:grid-cols-2 gap-6 mb-6">
                  <div class="space-y-2">
                    <label for="opportunityType" class="text-sm font-medium text-gray-700 block">Opportunity Type *</label>
                    <select id="opportunityType" name="opportunityType"
                            class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 border-gray-300 focus:ring-orange-500 focus:border-orange-500" required>
                      <option value="">Select opportunity type</option>
                      <option value="internship">Internship</option>
                      <option value="full-time">Full-time Position</option>
                      <option value="part-time">Part-time Position</option>
                      <option value="project">Project-based</option>
                      <option value="volunteer">Volunteer</option>
                    </select>
                    <p class="text-red-500 text-sm hidden" id="errorOpportunityType"></p>
                  </div>
                  <div class="space-y-2">
                    <label for="studentsWanted" class="text-sm font-medium text-gray-700 block">Number of Students Wanted</label>
                    <input id="studentsWanted" name="studentsWanted" type="number" placeholder="e.g., 5"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" />
                  </div>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="text-center pt-6">
                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-12 py-3 rounded-full text-lg">
                  Submit Offer
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- JS -->
  <script>
    const form = document.getElementById('offerForm');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Collect data
      const formData = {
        orgName: document.getElementById('orgName').value.trim(),
        orgType: document.getElementById('orgType').value,
        contactName: document.getElementById('contactName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        opportunityType: document.getElementById('opportunityType').value,
        studentsWanted: document.getElementById('studentsWanted').value.trim(),
      };

      // Basic validation
      let hasError = false;
      ['orgName','orgType','contactName','email','phone','opportunityType'].forEach(field=>{
        const errorEl = document.getElementById('error'+field.charAt(0).toUpperCase()+field.slice(1));
        if(!formData[field]){
          errorEl.textContent = field + ' is required';
          errorEl.classList.remove('hidden');
          hasError = true;
        } else {
          errorEl.textContent = '';
          errorEl.classList.add('hidden');
        }
      });

      if(hasError) return;

      // Prepare mailto
      const subject = encodeURIComponent(`New Offer Submission from ${formData.orgName}`);
      let body = `Organization Name: ${formData.orgName}
Organization Type: ${formData.orgType}
Contact Name: ${formData.contactName}
Email: ${formData.email}
Phone: ${formData.phone}
Opportunity Type: ${formData.opportunityType}
Number of Students Wanted: ${formData.studentsWanted}`;

      window.location.href = `mailto:connect@sumsnepal.com?subject=${subject}&body=${encodeURIComponent(body)}`;
    });
  </script>

</body>
</html>
